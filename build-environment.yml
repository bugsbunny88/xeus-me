name: build-env
channels:
  - conda-forge
dependencies:
  - python >=3.10,<3.13
  - pip >=24.2,<25
  - jupyter_server >=2.14.2,<2.15
  - ipywidgets >=8.0.4,<8.2
  - jupyterlab_execute_time >=3.1.2,<3.2
  - jupyterlite-core >=0.3.0,<0.4
  - jupyterlite-xeus >=0.1.9,<0.2
  - empack >=3.0.0,<4.0
  - bqplot
  - nomkl
  - jupyterlab_widgets >=3.0.4,<4.0.0
  - ipyvue
  - ipyvuetify
  - plotly >=5.12.0
  - jupyterlab-night
    # build
  - doit >=0.34,<1
  - hatch >=1.6.3,<2
  - importlib_metadata
  - jsonschema >=3
  - jupyterlab >=4.2.4,<4.3
  - notebook >=7.2.0,<7.3
  - pip
  - pkginfo
  - python-libarchive-c
  - requests_cache
  - twine >=5.1.1
  - wheel
