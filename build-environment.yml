name: build-env
channels:
  - conda-forge
dependencies:
  - python
  - pip
  # ALWAYS pin jupyterlite-core *and* jupyterlite-xeus together
  - jupyterlite==0.2.3
  - jupyterlite-xeus>=2.0.0,<3
  - voici_core>=0.7,<0.8    
  - jupyterlab_widgets ~= 3
  # ── optional lab extensions compiled for Lab 4.4 ───────
  - jupyterlab_execute_time
  - jupytext
  - ipywidgets>=8,<9 # gives @jupyter-widgets/base ^3 or ^4
  - jupyterlab_execute_time>=3.0.1,<4
  #- ipyvue>=1.11.2,<2
  #- ipyvuetify>=1.11.0,<2
  - plotly>=6.1.1,<7
