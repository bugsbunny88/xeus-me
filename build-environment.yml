name: build-env
channels:
  - conda-forge
dependencies:
  # ── core ───────────────────────────────────────────────
  - python=3.11
  - pip
  # ALWAYS pin jupyterlite-core *and* jupyterlite-xeus together
  - jupyterlite-core =0.5.4    # brings in JupyterLab 4.4.1
  - jupyterlite-xeus =3.1.*    # last 3.x build linked to Lab 4.4
  # ── optional lab extensions compiled for Lab 4.4 ───────
  - jupyterlab_execute_time =4.4.*   # underscore variant!
  - ipywidgets =8.*
  # ── any pure-python packages you need at build time ────
  - plotly
  - jupytext
  - nbdime>=3.2.1,<4
  - ipywidgets>=8.1.7,<9
  - ipyleaflet>=0.19.2,<0.20
  - sidecar>=0.5.2,<0.6
  - pythreejs>=2.4.2,<3
  - jupyterlab-git>=0.44.0,<0.45
  - jupyterlab-github>=3.0.1,<4
  - jupyterlab-latex>=3.1.0,<4
  - jupyter-lsp>=2.2.5,<3
  - bqplot>=0.12.43,<0.13
  - dask-labextension>=6.2.0,<7
  - jupyterlab_execute_time>=3.0.1,<4
  - perspective>=3.6.1,<4
  - jupyterlab-templates>=0.4.1,<0.5
  - jupyter-fs>=0.3.1,<0.4
  - ipylab>=1.0.0,<2
  - jupyterlab-system-monitor>=0.8.0,<0.9
  - ipyvolume>=0.6.3,<0.7
  - ipyvue>=1.11.2,<2
  - ipyvuetify>=1.11.0,<2
  - ipympl>=0.9.7,<0.10
  - plotly>=6.1.1,<7
  - ipygany>=0.5.0,<0.6
  - jupyterlab-drawio>=0.9.0,<0.10
  - ipydagred3>=0.3.8,<0.4
  - jupyterlab-email>=0.2.4,<0.3
  - ipydatawidgets>=4.3.2,<5
  - ipyscales>=0.7.0,<0.8
  - voila>=0.5.8,<0.6
