name: build-env
channels:
  - conda-forge
dependencies:
  - python
  - micromamba
  - pip
  #- jupyter_server >=2.10.0,<2.14.1
  #- jupyterlab_server >=2.24.0,<2.27.2
  #- ipywidgets >=8.1.3,<8.2
  - jupyterlab-cell-flash
  - jupyterlab-night
  - jupyterlab_execute_time >=3.1.2,<3.2
  - jupyterlite-core >=0.3.0,<0.4.0
  #- jupyterlite-xeus >=0.1.2,<0.2
  - empack >=3,<4
    # build stuff
  - depfinder
  - nbstripout
  - ruff =0.1.7
  - setuptools
  # demo stuff
  - ipywidgets >=8.0.4,<9
  - jupyter-server-proxy
  # avoid 200mb mkl
  - nomkl
    # the chunk below populates `../examples/jupyter_lite_config.json`,
  # rewriting `anaconda.org` links to `conda-forge`'s GitHub releases
  ### FEDERATED EXTENSIONS ###
  - ipycytoscape
  - jupyterlab_widgets >=3.0.4,<4.0.0
  - jupyterlab-fasta >=3,<4
  - jupyterlab-geojson >=3,<4
  - jupyterlab-kernelspy >=4.0.0
  # TODO: re-add after JupyterLab 4 compatibility
  # https://github.com/jupyterlite/jupyterlab-webrtc-docprovider/issues/16
  # - jupyterlab-webrtc-docprovider >=0.1.1
  # if a package is pinned with == `doit check` will ensure the version is pinned
  # in `docs/_build/_static/files/*.ipynb`
  - bqplot
  - ipycanvas
  - ipyleaflet
  - ipympl
  - ipyvue
  - ipyvuetify
  - plotly >=5.12.0
  ### FEDERATED EXTENSIONS ###

  # the chunk below gets copied from `../docs/environment.yml` by `doit env`
  ### DOCS ENV ###
  # runtimes
  - nodejs >=20,<21
  - python >=3.11,<3.12
  # build
  - doit >=0.34,<1
  - hatch >=1.6.3,<2
  - jsonschema >=3
  - jupyterlab >=4.2.1,<4.3
  - notebook >=7.2.0,<7.3
  - pip
  - pkginfo
  - python-libarchive-c
  - requests_cache
  - twine
  - wheel
  # cli
  - wheel
  # language packs and contents
  - jupyter_server >=1.11,<3
  - jupyterlab_server >=2.27.1,<3
  ### DOCS ENV ###
  - pip:
    - jupyterlite-xeus==0.2.0a0
