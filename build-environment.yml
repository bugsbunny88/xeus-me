name: build-env
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  # ALWAYS pin jupyterlite-core *and* jupyterlite-xeus together
  - jupyterlite-core>0.5
  - jupyterlite-xeus>3    # last 3.x build linked to Lab 4.4
  - ipywidgets ~= 7.7      # gives @jupyter-widgets/base ^3 or ^4
  - jupyterlab_widgets ~= 3
  # ── optional lab extensions compiled for Lab 4.4 ───────
  - jupyterlab_execute_time
  #- ipywidgets=8.*
  # ── any pure-python packages you need at build time ────
  - plotly
  - jupytext
  - nbdime>=3.2.1,<4
  - ipywidgets>=8.1.7,<9
  - bqplot>=0.12.43,<0.13
  - jupyterlab_execute_time>=3.0.1,<4
  - ipyvolume>=0.6.3,<0.7
  #- ipyvue>=1.11.2,<2
  #- ipyvuetify>=1.11.0,<2
  - plotly>=6.1.1,<7
  - voila>=0.5.8,<0.6
