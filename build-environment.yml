name: build-env
channels:
  - conda-forge
dependencies:
  # ── core ───────────────────────────────────────────────
  - python=3.11
  # ALWAYS pin jupyterlite-core *and* jupyterlite-xeus together
  - jupyterlite-core=0.5.4    # brings in JupyterLab 4.3.4
  - jupyterlite-xeus=3.0.*    # last build linked to Lab 4.3
  # ── optional lab extensions compiled for Lab 4.3 ───────
  - jupyterlab_execute_time=4.3.*   # underscore variant!
  - ipywidgets=8.*
  # ── any pure-python packages you need at build time ────
  - plotly
  - jupytext
