name: xeus-python-kernel
channels:
  - https://repo.mamba.pm/emscripten-forge
  - conda-forge
dependencies:
  - python=3.11
  - xeus-python  # Jupyter kernel based on the xeus library for improved execution and debugging in notebooks
  - ipywidgets>=8.1.5,<9
  - jupytext>=1.16.6,<2
  - matplotlib==3.5.2
  - numpy==1.25.2
  - openpyxl >=3.0.9,<4  # Excel file reader/writer for xlsx/xlsm formats, useful for interacting with spreadsheet data
  - orjson>=3.10.6,<4
  - pandas==1.5.3 # Essential library for data manipulation and analysis, especially for tabular data (DataFrames)
  - plotly>=5.24.1
  - requests>=2.32.3,<3  # Easy-to-use HTTP library for making web requests and interacting with APIs
  - scipy==1.11.1  # Core scientific computing library that provides functions for optimization, integration, interpolation, and more
  - seaborn>=0.13.2,<0.14
 











 
